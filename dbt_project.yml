# ──────────────────────────────────────────────────────────────
# Cardio Data Pipeline : projet dbt + BigQuery
# Nettoyage et validation d'un jeu de données public de cardiologie
# (UCI Heart Disease, base Cleveland, 303 patients).
# ──────────────────────────────────────────────────────────────


name: 'cardio_data_pipeline'
version: '1.0.0'
config-version: 2

# Profil de connexion (géré par dbt Cloud)
profile: 'default'

# Emplacement des fichiers du projet
model-paths: ["models"]        # transformations SQL (staging)
analysis-paths: ["analyses"]
test-paths: ["tests"]          # tests personnalisés (ex. plausibilité physiologique)
seed-paths: ["seeds"]          # données brutes en CSV (heart_disease.csv)
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

# Dossiers générés automatiquement (supprimés par `dbt clean`)
target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

# Matérialisation des modèles
models:
  cardio_data_pipeline:
    # Modèles de nettoyage : de simples vues, sans stockage supplémentaire
    cardio:
      +materialized: view
    # Applies to all files under models/example/
    example:
      +materialized: table
